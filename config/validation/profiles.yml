validate_profiles:
  v1_book1_strict_ip:
    checks:
      character_integrity_forbid:
        - FACE_SHAPE_CHANGE
        - IDENTITY_DRIFT
        - AGE_SHIFT
        - AGE_REGRESSION
        - YOUTHENING

      ip_integrity_forbid:
        - ANY_LOGOS
        - ANY_BRAND_MARKS
        - ANY_RECOGNIZABLE_MASCOTS
        - ANY_RECOGNIZABLE_CHARACTERS
        - AIRLINE_LIVERIES
        - TAIL_LOGOS
        - BRAND_WORDMARKS

      style_integrity_forbid:
        - PHOTOREALISM
        - CGI_3D
        - PAINTERLY
        - COLLAGE
        - HYBRID
        - EXTREME_STYLE_CHANGE
        - CARTOONISH_STYLE
        - PIXAR_STYLE
        - VIDEO_GAME_STYLE

      relaxations:
        allow_soft_atmosphere: true
        allow_wider_color_variance: true
        allow_saturation_variance: true
        allow_brightness_variance: true

        # Keep core look locked
        allow_contrast_variance: false
        allow_pastel_color_palette: false
        allow_watercolor_style: false
        allow_illustrative_style: false
        allow_sketch_style: false
        
        # Explicit palette guard (optional but recommended)
        palette_lock: ANIME_CEL_COLOR

  v2_cherry_blossom_soft_tone:
