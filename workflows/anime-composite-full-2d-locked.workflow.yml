# workflows/anime-composite-full-2d-locked.workflow.yml
#
# ANIME_COMPOSITE__FULL_2D_LOCKED — GitHub-pipeline-style execution plan
#
# Key design:
# 1) Render jobs ONLY render + upload attempt1 artifacts.
# 2) Validate jobs:
#    - download attempt1
#    - validate (soft fail)
#    - if failed: re-render once with tighter abstraction + lower variance
#    - validate attempt2 (hard fail)
#    - publish a single final artifact consumed by downstream jobs
#
# This avoids copy/paste of DISALLOW across jobs by treating policies/profiles as CONFIG INPUTS:
# - Book config:   config/books/*.yml
# - Arc config:    config/arcs/*/*.yml
# - Validation:    config/validation/profiles.yml   (schema expects validate_profiles)
#
# NOTE: Replace `renderer ...` and `validator ...` with your actual CLI/tooling.

name: ANIME_COMPOSITE__FULL_2D_LOCKED

on:
  workflow_dispatch:
    inputs:
      config_book:
        description: "Book config file"
        required: true
        default: "config/books/v1-book1.tokyo-kyoto-osaka-nara.yml"
      config_arc:
        description: "Arc config file"
        required: true
        default: "config/arcs/v2-golden-route-2025/tokyo.yml"
      validation_profiles:
        description: "Validation profiles file"
        required: true
        default: "config/validation/profiles.yml"
      default_validate_profile:
        description: "Profile key in validate_profiles"
        required: true
        default: "v1_book1_strict_ip"
      text_language_mode:
        description: "EN_ONLY | JP_ONLY | MIXED_EN_JP"
        required: true
        default: "MIXED_EN_JP"
      location_hint:
        description: "Optional location hint (e.g., NRT)"
        required: false
        default: ""
      fail_softly:
        description: "true = auto-regenerate once on validation fail"
        required: true
        default: "true"
      arc_id:
        description: "Arc identifier for outputs"
        required: true
        default: "v2-golden-route-2025"
      chapter_id:
        description: "Chapter identifier for outputs"
        required: true
        default: "tokyo-ward-01"

env:
  # Global retry policy (validate jobs use this)
  MAX_RETRIES: "1"

  # Config inputs (single source of truth for policies/profiles)
  CONFIG_BOOK: ${{ inputs.config_book }}
  CONFIG_ARC: ${{ inputs.config_arc }}
  VALIDATION_PROFILES_FILE: ${{ inputs.validation_profiles }}
  VALIDATE_PROFILE: ${{ inputs.default_validate_profile }}

  # Runtime knobs
  TEXT_LANGUAGE_MODE: ${{ inputs.text_language_mode }}
  LOCATION_HINT: ${{ inputs.location_hint }}
  FAIL_SOFTLY: ${{ inputs.fail_softly }}

  # Output labeling
  ARC_ID: ${{ inputs.arc_id }}
  CHAPTER_ID: ${{ inputs.chapter_id }}

jobs:
  # ─────────────────────────────────────────────
  # STEP 0 — Start Clean Workflow (STATE ONLY)
  # Purpose: Initialize clean runtime state
  # Generates image: ❌ No
  # ─────────────────────────────────────────────
  step0_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: WORKFLOW (STATE ONLY)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: WORKFLOW"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: ASSERT_STYLE_STATE"

  # ─────────────────────────────────────────────
  # STEP 1 — Assert Base Style (STATE ONLY)
  # Purpose: Prevent silent style drift
  # Generates image: ❌ No
  # ─────────────────────────────────────────────
  step1_assert_style:
    runs-on: ubuntu-latest
    needs: [step0_workflow]
    steps:
      - name: ASSERT_STYLE_STATE (STATE ONLY)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: ASSERT_STYLE_STATE"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: INITIATE_CHARACTER_MODEL_LOCK"

  # ─────────────────────────────────────────────
  # STEP 2 — Character Model Lock (STATE ONLY)
  # Purpose: Lock unified character model using reference photos
  # Generates image: ❌ No
  # ─────────────────────────────────────────────
  step2_lock_character_model:
    runs-on: ubuntu-latest
    needs: [step1_assert_style]
    steps:
      - name: INITIATE — Character Model Lock (STATE ONLY)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: INITIATE"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: CREATE_START_PAGE"

  # ─────────────────────────────────────────────
  # STEP 3 — Lock Characters to Start Page (STATE ONLY)
  # Purpose: Ensure facial + design consistency anchored to Start Page output
  # Generates image: ❌ No
  # ─────────────────────────────────────────────
  step3_assert_character_lock:
    runs-on: ubuntu-latest
    needs: [step2_lock_character_model]
    steps:
      - name: ASSERT_CHARACTER_LOCK (STATE ONLY)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: ASSERT_CHARACTER_LOCK"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: ASSERT_ENVIRONMENT_RULES"

  # ─────────────────────────────────────────────
  # STEP 4 — Assert Environment Rules (STATE ONLY)
  # Purpose: Safe handling of monuments/statues/artwork/signage/IP displays
  # Generates image: ❌ No
  # ─────────────────────────────────────────────
  step4_assert_environment:
    runs-on: ubuntu-latest
    needs: [step3_assert_character_lock]
    steps:
      - name: ASSERT_ENVIRONMENT_RULES (STATE ONLY)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: ASSERT_ENVIRONMENT_RULES"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: CREATE_START_PAGE"

  # ─────────────────────────────────────────────
  # RENDER — START PAGE (Attempt 1 only)
  # Purpose: Chapter intro start page
  # Generates image: ✅ Yes (attempt1 artifact)
  # ─────────────────────────────────────────────
  render_start_page:
    runs-on: ubuntu-latest
    needs: [step0_workflow, step4_assert_environment]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render START PAGE (Attempt 1)
        run: |
          mkdir -p out/start-page
          renderer create-start-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --text-language "$TEXT_LANGUAGE_MODE" \
            --location-hint "$LOCATION_HINT" \
            --out "out/start-page/start-page.attempt1.png"

      - name: Upload START PAGE (attempt1)
        uses: actions/upload-artifact@v4
        with:
          name: start-page-attempt1
          path: out/start-page/start-page.attempt1.png

  # ─────────────────────────────────────────────
  # VALIDATE — START PAGE (soft fail + 1 retry)
  # Purpose: Enforce policies/profile; if fail and FAIL_SOFTLY=true, rerender once tightened
  # Publishes: start-page-final
  # ─────────────────────────────────────────────
  validate_start_page:
    runs-on: ubuntu-latest
    needs: [render_start_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download START PAGE (attempt1)
        uses: actions/download-artifact@v4
        with:
          name: start-page-attempt1
          path: out/start-page

      # Attempt 1 validation — SOFT FAIL (job continues)
      - name: Validate START PAGE (Attempt 1) — soft fail
        id: validate_1
        continue-on-error: true
        run: |
          mkdir -p out/reports
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/start-page/start-page.attempt1.png" \
            --report "out/reports/start-page.attempt1.json"

      # Gate retry decision
      - name: Gate retry (START PAGE)
        id: gate
        run: |
          # Default: no retry
          SHOULD_RETRY=false

          # If fail_softly is true AND MAX_RETRIES >= 1 AND report indicates failure -> retry
          if [ "$FAIL_SOFTLY" = "true" ] && [ "$MAX_RETRIES" -ge 1 ]; then
            if [ -f "out/reports/start-page.attempt1.json" ]; then
              PASSED=$(jq -r '.passed' out/reports/start-page.attempt1.json 2>/dev/null || echo "false")
              if [ "$PASSED" != "true" ]; then
                SHOULD_RETRY=true
              fi
            else
              SHOULD_RETRY=true
            fi
          fi

          echo "SHOULD_RETRY=$SHOULD_RETRY" >> $GITHUB_OUTPUT

      # Attempt 2 render — tightened abstraction + lower variance
      - name: Re-render START PAGE (Attempt 2 / Tightened)
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          mkdir -p out/start-page
          renderer create-start-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --text-language "$TEXT_LANGUAGE_MODE" \
            --location-hint "" \
            --override "CAPTION_VARIANCE=NONE" \
            --override "ALLOW_REAL_PLACE_NAMES=FALSE" \
            --override "LOCATION_POLICY=GENERIC_ONLY" \
            --override "ENVIRONMENT_SIMPLIFICATION=VERY_HIGH" \
            --override "NO_YOUTHENING=TRUE" \
            --out "out/start-page/start-page.attempt2.png"

      # Attempt 2 validation — HARD FAIL (if it fails now, stop)
      - name: Validate START PAGE (Attempt 2) — hard fail
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/start-page/start-page.attempt2.png" \
            --report "out/reports/start-page.attempt2.json"

      # Select final artifact
      - name: Select START PAGE final
        run: |
          mkdir -p out/final
          if [ -f "out/start-page/start-page.attempt2.png" ]; then
            cp "out/start-page/start-page.attempt2.png" "out/final/start-page.final.png"
            cp "out/reports/start-page.attempt2.json" "out/final/start-page.final.validate.json" || true
          else
            cp "out/start-page/start-page.attempt1.png" "out/final/start-page.final.png"
            cp "out/reports/start-page.attempt1.json" "out/final/start-page.final.validate.json" || true
          fi

      - name: Upload START PAGE final
        uses: actions/upload-artifact@v4
        with:
          name: start-page-final
          path: out/final/start-page.final.png

  # ─────────────────────────────────────────────
  # RENDER — NARRATIVE PAGE (Attempt 1 only)
  # Purpose: Main story progression
  # Depends on: validated start page (hard gate)
  # ─────────────────────────────────────────────
  render_manga_page:
    runs-on: ubuntu-latest
    needs: [validate_start_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download START PAGE final (for lock context)
        uses: actions/download-artifact@v4
        with:
          name: start-page-final
          path: out/locked

      - name: Render MANGA PAGE (Attempt 1)
        run: |
          mkdir -p out/manga-page
          renderer generate-manga-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --locked-start "out/locked/start-page.final.png" \
            --out "out/manga-page/manga-page.attempt1.png"

      - name: Upload MANGA PAGE (attempt1)
        uses: actions/upload-artifact@v4
        with:
          name: manga-page-attempt1
          path: out/manga-page/manga-page.attempt1.png

  # ─────────────────────────────────────────────
  # VALIDATE — NARRATIVE PAGE (soft fail + 1 retry)
  # Publishes: manga-page-final
  # ─────────────────────────────────────────────
  validate_manga_page:
    runs-on: ubuntu-latest
    needs: [render_manga_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MANGA PAGE (attempt1)
        uses: actions/download-artifact@v4
        with:
          name: manga-page-attempt1
          path: out/manga-page

      - name: Validate MANGA PAGE (Attempt 1) — soft fail
        id: validate_1
        continue-on-error: true
        run: |
          mkdir -p out/reports
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/manga-page/manga-page.attempt1.png" \
            --report "out/reports/manga-page.attempt1.json"

      - name: Gate retry (MANGA PAGE)
        id: gate
        run: |
          SHOULD_RETRY=false
          if [ "$FAIL_SOFTLY" = "true" ] && [ "$MAX_RETRIES" -ge 1 ]; then
            PASSED=$(jq -r '.passed' out/reports/manga-page.attempt1.json 2>/dev/null || echo "false")
            if [ "$PASSED" != "true" ]; then
              SHOULD_RETRY=true
            fi
          fi
          echo "SHOULD_RETRY=$SHOULD_RETRY" >> $GITHUB_OUTPUT

      - name: Re-render MANGA PAGE (Attempt 2 / Tightened)
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          renderer generate-manga-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --override "CAPTION_VARIANCE=NONE" \
            --override "ALLOW_REAL_PLACE_NAMES=FALSE" \
            --override "ENVIRONMENT_SIMPLIFICATION=VERY_HIGH" \
            --override "NO_YOUTHENING=TRUE" \
            --out "out/manga-page/manga-page.attempt2.png"

      - name: Validate MANGA PAGE (Attempt 2) — hard fail
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/manga-page/manga-page.attempt2.png" \
            --report "out/reports/manga-page.attempt2.json"

      - name: Select MANGA PAGE final
        run: |
          mkdir -p out/final
          if [ -f "out/manga-page/manga-page.attempt2.png" ]; then
            cp "out/manga-page/manga-page.attempt2.png" "out/final/manga-page.final.png"
          else
            cp "out/manga-page/manga-page.attempt1.png" "out/final/manga-page.final.png"
          fi

      - name: Upload MANGA PAGE final
        uses: actions/upload-artifact@v4
        with:
          name: manga-page-final
          path: out/final/manga-page.final.png

  # ─────────────────────────────────────────────
  # RENDER — FILLER PAGE (Attempt 1 only)
  # Depends on: validated narrative page
  # ─────────────────────────────────────────────
  render_filler_page:
    runs-on: ubuntu-latest
    needs: [validate_manga_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render FILLER PAGE (Attempt 1)
        run: |
          mkdir -p out/filler-page
          renderer generate-filler-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --out "out/filler-page/filler-page.attempt1.png"

      - name: Upload FILLER PAGE (attempt1)
        uses: actions/upload-artifact@v4
        with:
          name: filler-page-attempt1
          path: out/filler-page/filler-page.attempt1.png

  # ─────────────────────────────────────────────
  # VALIDATE — FILLER PAGE (soft fail + 1 retry)
  # Publishes: filler-page-final
  # ─────────────────────────────────────────────
  validate_filler_page:
    runs-on: ubuntu-latest
    needs: [render_filler_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download FILLER PAGE (attempt1)
        uses: actions/download-artifact@v4
        with:
          name: filler-page-attempt1
          path: out/filler-page

      - name: Validate FILLER PAGE (Attempt 1) — soft fail
        id: validate_1
        continue-on-error: true
        run: |
          mkdir -p out/reports
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/filler-page/filler-page.attempt1.png" \
            --report "out/reports/filler-page.attempt1.json"

      - name: Gate retry (FILLER PAGE)
        id: gate
        run: |
          SHOULD_RETRY=false
          if [ "$FAIL_SOFTLY" = "true" ] && [ "$MAX_RETRIES" -ge 1 ]; then
            PASSED=$(jq -r '.passed' out/reports/filler-page.attempt1.json 2>/dev/null || echo "false")
            if [ "$PASSED" != "true" ]; then
              SHOULD_RETRY=true
            fi
          fi
          echo "SHOULD_RETRY=$SHOULD_RETRY" >> $GITHUB_OUTPUT

      - name: Re-render FILLER PAGE (Attempt 2 / Tightened)
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          renderer generate-filler-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --override "CAPTION_VARIANCE=NONE" \
            --override "ALLOW_REAL_PLACE_NAMES=FALSE" \
            --override "ENVIRONMENT_SIMPLIFICATION=VERY_HIGH" \
            --override "NO_YOUTHENING=TRUE" \
            --out "out/filler-page/filler-page.attempt2.png"

      - name: Validate FILLER PAGE (Attempt 2) — hard fail
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/filler-page/filler-page.attempt2.png" \
            --report "out/reports/filler-page.attempt2.json"

      - name: Select FILLER PAGE final
        run: |
          mkdir -p out/final
          if [ -f "out/filler-page/filler-page.attempt2.png" ]; then
            cp "out/filler-page/filler-page.attempt2.png" "out/final/filler-page.final.png"
          else
            cp "out/filler-page/filler-page.attempt1.png" "out/final/filler-page.final.png"
          fi

      - name: Upload FILLER PAGE final
        uses: actions/upload-artifact@v4
        with:
          name: filler-page-final
          path: out/final/filler-page.final.png

  # ─────────────────────────────────────────────
  # RENDER — END PAGE (Attempt 1 only)
  # Depends on: validated filler page
  # ─────────────────────────────────────────────
  render_end_page:
    runs-on: ubuntu-latest
    needs: [validate_filler_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render END PAGE (Attempt 1)
        run: |
          mkdir -p out/end-page
          renderer create-end-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --out "out/end-page/end-page.attempt1.png"

      - name: Upload END PAGE (attempt1)
        uses: actions/upload-artifact@v4
        with:
          name: end-page-attempt1
          path: out/end-page/end-page.attempt1.png

  # ─────────────────────────────────────────────
  # VALIDATE — END PAGE (soft fail + 1 retry)
  # Publishes: end-page-final
  # ─────────────────────────────────────────────
  validate_end_page:
    runs-on: ubuntu-latest
    needs: [render_end_page]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download END PAGE (attempt1)
        uses: actions/download-artifact@v4
        with:
          name: end-page-attempt1
          path: out/end-page

      - name: Validate END PAGE (Attempt 1) — soft fail
        id: validate_1
        continue-on-error: true
        run: |
          mkdir -p out/reports
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/end-page/end-page.attempt1.png" \
            --report "out/reports/end-page.attempt1.json"

      - name: Gate retry (END PAGE)
        id: gate
        run: |
          SHOULD_RETRY=false
          if [ "$FAIL_SOFTLY" = "true" ] && [ "$MAX_RETRIES" -ge 1 ]; then
            PASSED=$(jq -r '.passed' out/reports/end-page.attempt1.json 2>/dev/null || echo "false")
            if [ "$PASSED" != "true" ]; then
              SHOULD_RETRY=true
            fi
          fi
          echo "SHOULD_RETRY=$SHOULD_RETRY" >> $GITHUB_OUTPUT

      - name: Re-render END PAGE (Attempt 2 / Tightened)
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          renderer create-end-page \
            --book "$CONFIG_BOOK" \
            --arc "$CONFIG_ARC" \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --override "CAPTION_VARIANCE=NONE" \
            --override "ALLOW_REAL_PLACE_NAMES=FALSE" \
            --override "ENVIRONMENT_SIMPLIFICATION=VERY_HIGH" \
            --override "NO_YOUTHENING=TRUE" \
            --out "out/end-page/end-page.attempt2.png"

      - name: Validate END PAGE (Attempt 2) — hard fail
        if: steps.gate.outputs.SHOULD_RETRY == 'true'
        run: |
          validator validate \
            --profiles "$VALIDATION_PROFILES_FILE" \
            --profile "$VALIDATE_PROFILE" \
            --image "out/end-page/end-page.attempt2.png" \
            --report "out/reports/end-page.attempt2.json"

      - name: Select END PAGE final
        run: |
          mkdir -p out/final
          if [ -f "out/end-page/end-page.attempt2.png" ]; then
            cp "out/end-page/end-page.attempt2.png" "out/final/end-page.final.png"
          else
            cp "out/end-page/end-page.attempt1.png" "out/final/end-page.final.png"
          fi

      - name: Upload END PAGE final
        uses: actions/upload-artifact@v4
        with:
          name: end-page-final
          path: out/final/end-page.final.png

      - name: WORKFLOW COMPLETE (receipt)
        run: |
          echo "[UI RECEIPT — ANIME_COMPOSITE__FULL_2D_LOCKED]"
          echo "Command: WORKFLOW COMPLETE"
          echo "Type: STATE_ONLY"
          echo "Image Generated: No"
          echo "Next Step: start next chapter (or next book)"
